<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>SkViDerm — тест на телефоне</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #eee9e2;
                color: #382c2b;
                font:
                    15px/1.5 system-ui,
                    sans-serif;
                text-align: center;
            }
            header {
                padding: 12px 16px;
            }
            a {
                color: #8e4659;
            }
            iframe {
                display: block;
                width: min(390px, 100%);
                height: calc(100dvh - 94px);
                margin: 0 auto;
                border: 1px solid #b4aaa2;
                border-radius: 18px 18px 0 0;
                background: #faf8f4;
            }
        </style>
    </head>
    <body>
        <header>
            <strong>Тестовая витрина · экран 390 px</strong><br />Только вымышленные данные ·
            <a href="/" target="_blank">Открыть полный экран</a>
        </header>
        <iframe src="/" title="Тестовая мобильная витрина SkViDerm"></iframe>
    </body>
</html>
