<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">ProSkin</a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">
                        <i-bs name="house-door"></i-bs>
                        Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/products">
                        <i-bs name="grid"></i-bs>
                        Каталог
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i-bs name="tags"></i-bs>
                        Категории
                    </a>
                    <div class="dropdown-menu animate__animated animate__fadeIn">
                        <ul class="dropdown-grid">
                            <div *ngFor="let category of categories$ | async; let i = index" class="dropdown-item-container">
                                <li>
                                    <a
                                        class="dropdown-item animate__animated animate__fadeInRight"
                                        [style.animation-delay]="i * 50 + 'ms'"
                                        href="/category/{{ category.id }}"
                                    >
                                        <i class="bi bi-dot me-2" style="color: var(--secondary); font-size: 1.2rem"></i>
                                        {{ category.title }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i-bs name="award"></i-bs>
                        Бренды
                    </a>
                    <div class="dropdown-menu animate__animated animate__fadeIn">
                        <ul class="dropdown-grid">
                            <div *ngFor="let brand of brands$ | async; let i = index" class="dropdown-item-container">
                                <li>
                                    <a
                                        class="dropdown-item animate__animated animate__fadeInRight"
                                        [style.animation-delay]="i * 50 + 'ms'"
                                        href="/brand/{{ brand.id }}"
                                    >
                                        <img
                                            [src]="brand.image || 'assets/images/products/no-image.png'"
                                            [alt]="brand.title"
                                            class="brand-logo-small"
                                            onerror="this.src='assets/images/products/no-image.png'"
                                        />
                                        {{ brand.title }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-disabled="true">
                        <i-bs name="truck"></i-bs>
                        Доставка и оплата
                    </a>
                </li>
                <li class="nav-item" *ngIf="authService.isAdmin()">
                    <a class="nav-link active" href="/admin">
                        <i-bs name="gear"></i-bs>
                        Админ панель
                    </a>
                </li>
            </ul>

            <div class="cart-button">
                <button class="btn position-relative me-3" (click)="navigateToCart()">
                    <i-bs name="bag-heart"></i-bs>
                    Корзина
                    <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                        *ngIf="(getProductCount() | async) ?? 0 > 0"
                    >
                        {{ getProductCount() | async }}
                        <span class="visually-hidden">товаров в корзине</span>
                    </span>
                </button>
            </div>

            <div class="dropdown user-dropdown">
                <button class="btn user-icon-btn" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa fa-user"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end user-menu" aria-labelledby="userDropdown">
                    <li *ngIf="authService.isLoggedIn()" class="user-header">
                        <div class="user-info">
                            <i class="fa fa-user-circle user-avatar"></i>
                            <span class="user-name">{{ getUserDisplayName() }}</span>
                        </div>
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <hr class="dropdown-divider" />
                    </li>
                    <li *ngIf="!authService.isLoggedIn()">
                        <a class="dropdown-item" href="#" (click)="$event.preventDefault(); openLoginModal()">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                        </a>
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <a class="dropdown-item" routerLink="/profile"> <i-bs name="person"></i-bs>Личный кабинет </a>
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <a class="dropdown-item" routerLink="/orders"> <i-bs name="list-ul"></i-bs>История заказов </a>
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <a class="dropdown-item" routerLink="/favorites"> <i-bs name="heart"></i-bs>Избранное </a>
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <hr class="dropdown-divider" />
                    </li>
                    <li *ngIf="authService.isLoggedIn()">
                        <a class="dropdown-item text-danger" href="#" (click)="$event.preventDefault(); logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Выйти
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
