<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">ProSkin</a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/products">Каталог</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Категории
                    </a>
                    <div class="dropdown-menu">
                        <ul class="dropdown-grid">
                            <div *ngFor="let category of categories$ | async">
                                <li>
                                    <a class="dropdown-item" href="/category/{{ category.id }}">{{ category.title }}</a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Бренды
                    </a>
                    <div class="dropdown-menu">
                        <ul class="dropdown-grid">
                            <div *ngFor="let brand of brands$ | async">
                                <li>
                                    <a class="dropdown-item" href="/brand/{{ brand.id }}">{{ brand.title }}</a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-disabled="true">Доставка и оплата</a>
                </li>
            </ul>

            <div class="cart-button">
                <button class="btn btn-outline-light position-relative me-2" (click)="navigateToCart()">
                    <img src="assets/icons/cart.png" alt="Корзина" class="cart-icon" style="width: 20px; height: 20px; margin-right: 5px" />
                    <i class="bi bi-cart3"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        *ngIf="(getProductCount() | async) ?? 0 > 0"
                    >
                        {{ getProductCount() | async }}
                        <span class="visually-hidden">товаров в корзине</span>
                    </span>
                </button>
            </div>

            <div class="auth-buttons">
                <button
                    *ngIf="!authService.isLoggedIn()"
                    id="loginBtn"
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="openLoginModal()"
                >
                    Войти
                </button>
                <button *ngIf="authService.isLoggedIn()" id="logoutBtn" class="btn btn-outline-danger" type="button" (click)="logout()">
                    Выйти
                </button>
            </div>
        </div>
    </div>
</nav>
