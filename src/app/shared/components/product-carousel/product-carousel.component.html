<section class="sf-container product-story">
    <div class="sf-section-heading">
        <div>
            <p class="sf-eyebrow">Знакомимся ближе</p>
            <h2>Маленькие ритуалы. Каждый день.</h2>
        </div>
        <button type="button" class="sf-text-link" (click)="openCatalog()">Больше средств →</button>
    </div>
    @if (loading) {
        <p role="status">Загружаем товары…</p>
    }
    @if (error) {
        <p role="alert">{{ error }}</p>
    }
    @if (!loading && !error) {
        <div class="product-carousel" #productCarousel>
            @for (product of products; track product.id) {
                <article class="story-card">
                    <button
                        type="button"
                        class="product-image"
                        (click)="openProductDetailsWithScroll(product)"
                        [attr.aria-label]="'Посмотреть ' + product.title"
                    >
                        <img
                            [src]="product.image | imageUrl"
                            [alt]="product.title"
                            loading="lazy"
                            (load)="onImageLoad($event)"
                            (error)="onImageError($event)"
                        />
                    </button>
                    <p class="product-brand">{{ product.brand.title }}</p>
                    <button type="button" class="product-name" (click)="openProductDetailsWithScroll(product)">{{ product.title }}</button>
                    <div class="story-bottom">
                        <span>от {{ getMinPrice(product) | number: '1.2-2' }} <small>BYN</small></span
                        ><button
                            type="button"
                            class="story-open"
                            (click)="openProductDetailsWithScroll(product)"
                            [attr.aria-label]="'Выбрать ' + product.title"
                        >
                            →
                        </button>
                    </div>
                </article>
            }
        </div>
        <div class="story-controls">
            <button type="button" (click)="scrollLeft()" aria-label="Показать предыдущие товары" [disabled]="!products.length">←</button
            ><button type="button" (click)="scrollRight()" aria-label="Показать следующие товары" [disabled]="!products.length">→</button>
        </div>
    }
</section>
