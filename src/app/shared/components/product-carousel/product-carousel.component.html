<div class="container my-5">
  <div class="d-flex justify-content-center align-items-center mb-4">
    <h2 class="section-title text-center">Популярные товары</h2>
  </div>

  <div class="position-relative carousel-container">
    <div class="product-carousel" #productCarousel>
      <div class="product-card-wrapper" *ngFor="let product of products">
        <div class="card product-card h-100" tabindex="0" role="button"
            (click)="openProductDetails(product)"
            (keydown.enter)="openProductDetails(product)"
            (keydown.space)="openProductDetails(product); $event.preventDefault()">
          <div class="img-container">
            <img [src]="product.image || 'assets/images/products/no-image.png'" class="card-img-top" alt="{{ product.title }}" />
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ product.title }}</h5>
            <p class="card-text">Цена: {{ product.price }} р.</p>
            <div class="mt-auto">
              <button class="btn btn-primary w-100" (click)="$event.stopPropagation(); addToCart(product)">Купить</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <button class="btn carousel-arrow carousel-prev" type="button" (click)="scrollLeft()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
    </button>
    <button class="btn carousel-arrow carousel-next" type="button" (click)="scrollRight()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
      </svg>
    </button>
  </div>

  <div class="text-center mt-4">
    <button (click)="openCatalog()" class="btn btn-outline-primary">Показать больше</button>
  </div>
</div>
