<div class="pagination-container d-flex justify-content-between align-items-center mt-3">
    <div class="items-per-page">
        <label for="itemsPerPage" class="me-2">Элементов на странице:</label>
        <select
            id="itemsPerPage"
            class="form-select form-select-sm d-inline-block w-auto"
            (change)="onItemsPerPageChange($event)"
            [value]="itemsPerPage"
        >
            @for (size of pageSizeOptions; track size) {
                <option [value]="size">{{ size }}</option>
            }
        </select>
    </div>

    <nav aria-label="Навигация по страницам">
        <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" href="javascript:void(0)" (click)="onPageChange(1)" aria-label="Первая">
                    <span aria-hidden="true">&laquo;&laquo;</span>
                </a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage - 1)" aria-label="Предыдущая">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            @for (page of getPageRange(); track page) {
                <li class="page-item" [class.active]="page === currentPage">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page)">{{ page }}</a>
                </li>
            }

            <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage + 1)" aria-label="Следующая">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" href="javascript:void(0)" (click)="onPageChange(totalPages)" aria-label="Последняя">
                    <span aria-hidden="true">&raquo;&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="pagination-info">
        Показано {{ (currentPage - 1) * itemsPerPage + 1 }} - {{ Math.min(currentPage * itemsPerPage, totalItems) }} из {{ totalItems }}
    </div>
</div>
