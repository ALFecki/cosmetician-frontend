<div class="pagination-container">
    <div class="items-per-page">
        <label for="itemsPerPage">На странице</label>
        <select id="itemsPerPage" class="form-select" (change)="onItemsPerPageChange($event)" [value]="itemsPerPage">
            @for (size of pageSizeOptions; track size) {
                <option [value]="size">{{ size }}</option>
            }
        </select>
    </div>

    <nav aria-label="Навигация по страницам">
        <ul class="pagination">
            <li class="page-item first-page" [class.disabled]="currentPage === 1">
                <button
                    type="button"
                    class="page-link"
                    (click)="onPageChange(1)"
                    aria-label="Первая страница"
                    [disabled]="currentPage <= 1"
                >
                    <span class="double-chevron">
                        <i-bs name="chevron-left"></i-bs>
                        <i-bs name="chevron-left"></i-bs>
                    </span>
                </button>
            </li>
            <li class="page-item prev-page" [class.disabled]="currentPage === 1">
                <button
                    type="button"
                    class="page-link"
                    (click)="onPageChange(currentPage - 1)"
                    aria-label="Предыдущая страница"
                    [disabled]="currentPage <= 1"
                >
                    <i-bs name="chevron-left"></i-bs>
                </button>
            </li>

            @for (page of getPageRange(); track page) {
                <li
                    class="page-item page-number"
                    [class.active]="page === currentPage"
                    [class.distant-page]="Math.abs(page - currentPage) > 1"
                >
                    <button
                        type="button"
                        class="page-link"
                        (click)="onPageChange(page)"
                        [attr.aria-label]="'Страница ' + page"
                        [attr.aria-current]="page === currentPage ? 'page' : null"
                    >
                        {{ page }}
                    </button>
                </li>
            }

            <li class="page-item next-page" [class.disabled]="currentPage === totalPages">
                <button
                    type="button"
                    class="page-link"
                    (click)="onPageChange(currentPage + 1)"
                    aria-label="Следующая страница"
                    [disabled]="currentPage >= totalPages"
                >
                    <i-bs name="chevron-right"></i-bs>
                </button>
            </li>
            <li class="page-item last-page" [class.disabled]="currentPage === totalPages">
                <button
                    type="button"
                    class="page-link"
                    (click)="onPageChange(totalPages)"
                    aria-label="Последняя страница"
                    [disabled]="currentPage >= totalPages"
                >
                    <span class="double-chevron">
                        <i-bs name="chevron-right"></i-bs>
                        <i-bs name="chevron-right"></i-bs>
                    </span>
                </button>
            </li>
        </ul>
    </nav>

    <div class="pagination-info" aria-live="polite" aria-atomic="true">
        <span>
            {{ totalItems ? (currentPage - 1) * itemsPerPage + 1 : 0 }}–{{ Math.min(currentPage * itemsPerPage, totalItems) }}
            {{ ' из ' }}
            {{ totalItems }}
        </span>
    </div>
</div>
