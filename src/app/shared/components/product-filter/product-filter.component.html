<div class="filter-container mb-4">
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Фильтр товаров</h5>

            <div class="mb-3">
                <label for="searchName" class="form-label">Поиск по названию</label>
                <input
                    type="text"
                    class="form-control"
                    id="searchName"
                    placeholder="Введите название товара"
                    [(ngModel)]="filterData.title"
                />
            </div>

            <div class="mb-3">
                <label for="brandsFilter" class="form-label d-block">Бренды</label>
                <div id="brandsFilter" class="filter-scroll-container">
                    <div class="form-check" *ngFor="let brand of brands">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            [id]="'brand-' + brand.id"
                            [checked]="isBrandSelected(brand.id)"
                            (change)="toggleBrand(brand.id)"
                        />
                        <label class="form-check-label" [for]="'brand-' + brand.id">
                            {{ brand.title }}
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="categoriesFilter" class="form-label d-block">Категории</label>
                <div id="categoriesFilter" class="filter-scroll-container">
                    <div class="form-check" *ngFor="let category of categories">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            [id]="'category-' + category.id"
                            [checked]="isCategorySelected(category.id)"
                            (change)="toggleCategory(category.id)"
                        />
                        <label class="form-check-label" [for]="'category-' + category.id">
                            {{ category.title }}
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="countriesFilter" class="form-label d-block">Страны</label>
                <div id="countriesFilter" class="filter-scroll-container">
                    <div class="form-check" *ngFor="let country of countries">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            [id]="'country-' + country.id"
                            [checked]="isCountrySelected(country.id)"
                            (change)="toggleCountry(country.id)"
                        />
                        <label class="form-check-label" [for]="'country-' + country.id">
                            {{ country.name }}
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="minPrice" class="form-label">Мин. цена</label>
                    <input type="number" class="form-control" id="minPrice" placeholder="От" [(ngModel)]="filterData.minPrice" />
                </div>
                <div class="col-md-6">
                    <label for="maxPrice" class="form-label">Макс. цена</label>
                    <input type="number" class="form-control" id="maxPrice" placeholder="До" [(ngModel)]="filterData.maxPrice" />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="minVolume" class="form-label">Мин. объем (мл)</label>
                    <input type="number" class="form-control" id="minVolume" placeholder="От" [(ngModel)]="filterData.minVolume" />
                </div>
                <div class="col-md-6">
                    <label for="maxVolume" class="form-label">Макс. объем (мл)</label>
                    <input type="number" class="form-control" id="maxVolume" placeholder="До" [(ngModel)]="filterData.maxVolume" />
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <button class="btn btn-secondary" (click)="resetFilter()">Сбросить</button>
                <button class="btn btn-primary" (click)="applyFilter()">Применить</button>
            </div>
        </div>
    </div>
</div>
