<div class="filter-container">
    <div class="card">
        <div class="card-body">
            <div class="filter-grid">
                <div class="filter-item">
                    <label for="searchName" class="form-label">
                        <i class="bi bi-search me-1"></i>
                        Поиск
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="searchName"
                        placeholder="Название товара..."
                        [(ngModel)]="filterData.title"
                    />
                </div>

                <div class="filter-item">
                    <label for="brandsFilter" class="form-label">
                        <i class="bi bi-tag me-1"></i>
                        Бренды
                    </label>
                    <div id="brandsFilter" class="filter-scroll-container">
                        @for (brand of brands; track brand) {
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    [id]="'brand-' + brand.id"
                                    [checked]="isBrandSelected(brand.id)"
                                    (change)="toggleBrand(brand.id)"
                                />
                                <label class="form-check-label" [for]="'brand-' + brand.id">
                                    {{ brand.title }}
                                </label>
                            </div>
                        }
                    </div>
                </div>

                <div class="filter-item">
                    <label for="categoriesFilter" class="form-label">
                        <i class="bi bi-grid-3x3-gap me-1"></i>
                        Категории
                    </label>
                    <div id="categoriesFilter" class="filter-scroll-container">
                        @for (category of categories; track category) {
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    [id]="'category-' + category.id"
                                    [checked]="isCategorySelected(category.id)"
                                    (change)="toggleCategory(category.id)"
                                />
                                <label class="form-check-label" [for]="'category-' + category.id">
                                    {{ category.title }}
                                </label>
                            </div>
                        }
                    </div>
                </div>

                <div class="filter-item">
                    <label for="productScopesFilter" class="form-label">
                        <i class="bi bi-globe me-1"></i>
                        Области применения
                    </label>
                    <div id="productScopesFilter" class="filter-scroll-container">
                        @for (productScope of productScopes; track productScope) {
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    [id]="'productScope-' + productScope.id"
                                    [checked]="isProductScopeSelected(productScope.id)"
                                    (change)="toggleProductScope(productScope.id)"
                                />
                                <label class="form-check-label" [for]="'productScope-' + productScope.id">
                                    {{ productScope.title }}
                                </label>
                            </div>
                        }
                    </div>
                </div>

                <div class="filter-item filter-item-compact">
                    <label for="minPrice" class="form-label">
                        <i class="bi bi-currency-exchange me-1"></i>
                        Цена
                    </label>
                    <div class="input-group-range">
                        <input type="number" class="form-control" id="minPrice" placeholder="От" [(ngModel)]="filterData.minPrice" />
                        <span class="range-separator">—</span>
                        <input type="number" class="form-control" id="maxPrice" placeholder="До" [(ngModel)]="filterData.maxPrice" />
                    </div>
                </div>

                <div class="filter-item filter-item-compact">
                    <label for="minVolume" class="form-label">
                        <i class="bi bi-droplet me-1"></i>
                        Объем (мл)
                    </label>
                    <div class="input-group-range">
                        <input type="number" class="form-control" id="minVolume" placeholder="От" [(ngModel)]="filterData.minVolume" />
                        <span class="range-separator">—</span>
                        <input type="number" class="form-control" id="maxVolume" placeholder="До" [(ngModel)]="filterData.maxVolume" />
                    </div>
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn btn-secondary" (click)="resetFilter()">
                    <i class="bi bi-arrow-clockwise me-1"></i>
                    Сбросить
                </button>
                <button class="btn btn-primary" (click)="applyFilter()">
                    <i class="bi bi-check-lg me-1"></i>
                    Применить
                </button>
            </div>
        </div>
    </div>
</div>
