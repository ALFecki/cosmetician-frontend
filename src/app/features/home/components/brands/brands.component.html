<section class="brands-section">
    <div class="sf-container">
        <p class="brand-caption">Профессиональный уход от знакомых брендов</p>
        @if (error) {
            <p role="alert">{{ error }}</p>
        }
        <div class="brand-row">
            @for (brand of brands$ | async; track brand.id) {
                <a [routerLink]="['/brand', brand.id]" [attr.aria-label]="'Средства ' + brand.title"
                    ><img [src]="brand.image || getPlaceholderImage() | imageUrl" [alt]="brand.title" loading="lazy"
                /></a>
            }
        </div>
    </div>
</section>
