<!-- eslint-disable @angular-eslint/template/elements-content -->
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div *ngFor="let slide of slides; let i = index" class="carousel-item" [class.active]="i === currentIndex">
            <div class="image-container">
                <img [src]="slide.image" class="d-block w-100" alt="{{ slide.title }}" />
                <div class="overlay">
                    <h2 class="slide-title">{{ slide.title }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="carousel-controls">
        <button class="carousel-control carousel-control-prev" (click)="prevSlide()" tabindex="0">
            <span class="control-icon">←</span>
        </button>

        <div class="carousel-indicators">
            <button
                *ngFor="let slide of slides; let i = index"
                class="indicator"
                [class.active]="i === currentIndex"
                (click)="goToSlide(i)"
                tabindex="0"
            ></button>
        </div>

        <button class="carousel-control carousel-control-next" (click)="nextSlide()" tabindex="0">
            <span class="control-icon">→</span>
        </button>
    </div>
</div>
