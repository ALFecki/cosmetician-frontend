<section class="sf-container benefits-section">
    <p class="sf-eyebrow">С заботой о вас</p>
    <h2>Преимущества SkViDerm</h2>
    <div class="benefits-grid">
        @for (benefit of benefits; track benefit.title; let i = $index) {
            <article>
                <span class="benefit-number">0{{ i + 1 }}</span>
                <h3>{{ benefit.title }}</h3>
                <p>{{ benefit.description }}</p>
            </article>
        }
    </div>
</section>
