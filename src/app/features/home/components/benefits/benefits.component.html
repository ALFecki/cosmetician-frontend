<div class="container mt-5">
    <h2 class="text-center mb-4">Преимущества ProSkin</h2>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let benefit of benefits">
            <div class="card text-center">
                <div class="card-body">
                    <div class="circle-icon mb-3">
                        <img [src]="benefit.icon" alt="{{ benefit.title }}" class="img-fluid" />
                    </div>
                    <h5 class="card-title">{{ benefit.title }}</h5>
                    <p class="card-text">{{ benefit.description }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
