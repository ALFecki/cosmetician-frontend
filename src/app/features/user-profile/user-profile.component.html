<div class="container my-5">
    <div class="row">
        <div class="col-md-3">
            <app-profile-sidebar></app-profile-sidebar>
        </div>

        <div class="col-md-9">
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Личные данные</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
                        <div class="alert alert-success" *ngIf="success">{{ success }}</div>
                        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

                        <div class="mb-3 row">
                            <label for="firstName" class="col-md-3 col-form-label">Имя</label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" id="firstName" formControlName="firstName" />
                                <div
                                    class="form-text text-danger"
                                    *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched"
                                >
                                    Имя обязательно для заполнения
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="secondName" class="col-md-3 col-form-label">Фамилия</label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" id="secondName" formControlName="secondName" />
                                <div
                                    class="form-text text-danger"
                                    *ngIf="profileForm.get('secondName')?.invalid && profileForm.get('secondName')?.touched"
                                >
                                    Фамилия обязательна для заполнения
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="surname" class="col-md-3 col-form-label">Отчество</label>
                            <div class="col-md-9">
                                <input type="text" class="form-control" id="surname" formControlName="surname" />
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="email" class="col-md-3 col-form-label">Email</label>
                            <div class="col-md-9">
                                <input type="email" class="form-control" id="email" formControlName="email" [disabled]="true" />
                                <div class="form-text">Для изменения email обратитесь в службу поддержки</div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="phone" class="col-md-3 col-form-label">Телефон</label>
                            <div class="col-md-9">
                                <input type="tel" class="form-control" id="phone" formControlName="phone" />
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || loading">
                                <span class="spinner-border spinner-border-sm me-1" *ngIf="loading" role="status" aria-hidden="true"></span>
                                Сохранить изменения
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
