<div class="container mt-4">
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>

    <div *ngIf="error" class="alert alert-danger mx-3" role="alert">
        {{ error }}
    </div>

    <div *ngIf="!loading && !error && (brand$ | async) as brandData">
        <!-- Full-width Brand Hero Banner -->
        <div class="brand-hero">
            <div class="container">
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Главная</a></li>
                        <li class="breadcrumb-item"><a href="/products">Каталог</a></li>
                        <li class="breadcrumb-item active">{{ brandData.title }}</li>
                    </ol>
                </nav>

                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <div class="brand-content">
                            <h1 class="brand-title text-center">{{ brandData.title }}</h1>
                            <div class="brand-description text-center" *ngIf="brandData.description">
                                <p>{{ brandData.description }}</p>
                            </div>
                            <div class="brand-stats mt-4 justify-content-center">
                                <div class="stat-item">
                                    <i-bs name="award" class="stat-icon"></i-bs>
                                    <span class="stat-text">Премиальное качество</span>
                                </div>
                                <div class="stat-item">
                                    <i-bs name="shield-check" class="stat-icon"></i-bs>
                                    <span class="stat-text">Сертифицированные товары</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4" *ngIf="brandData.image">
                        <div class="brand-image-container">
                            <img [src]="brandData.image" [alt]="brandData.title" class="brand-image-large" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="hero-decoration"></div>
        </div>

        <!-- Products Section -->
        <div class="container">
            <app-products [brandId]="brandId"></app-products>
        </div>
    </div>
</div>
