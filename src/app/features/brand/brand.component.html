<div *ngIf="brand | async as brandData" class="container mt-4">
    <header class="brand-header text-center mb-4">
        <img *ngIf="brandData.image" [src]="brandData.image" alt="{{ brandData.title }}" class="img-fluid rounded" />
        <h1 class="display-4">{{ brandData.title }}</h1>
        <p class="lead">{{ brandData.description }}</p>
    </header>

    <div class="row">
        <div class="col">
            <app-products [brandId]="this.brandId"></app-products>
        </div>
    </div>
</div>
