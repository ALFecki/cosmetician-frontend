<div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Загрузка...</span>
    </div>
</div>

<div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
</div>

<div *ngIf="category | async as categoryData" class="container mt-4">
    <header class="category-header text-center mb-4">
        <h1 class="display-4">{{ categoryData.title }}</h1>
        <p class="lead">{{ categoryData.description }}</p>
        <img *ngIf="categoryData.image" [src]="categoryData.image" alt="{{ categoryData.title }}" class="img-fluid rounded" />
    </header>

    <div class="row">
        <div class="col">
            <app-products [categoryId]="this.categoryId"></app-products>
        </div>
    </div>
</div>
