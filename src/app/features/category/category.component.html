<div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Загрузка...</span>
    </div>
</div>

<div *ngIf="error" class="alert alert-danger mx-3" role="alert">
    {{ error }}
</div>

<div *ngIf="category | async as categoryData">
    <!-- Category Hero Section -->
    <div class="category-hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <div class="category-info">
                        <nav aria-label="breadcrumb" class="mb-3">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/">Главная</a></li>
                                <li class="breadcrumb-item"><a href="/products">Каталог</a></li>
                                <li class="breadcrumb-item active">{{ categoryData.title }}</li>
                            </ol>
                        </nav>
                        <h1 class="category-title">{{ categoryData.title }}</h1>
                        <p class="category-description" *ngIf="categoryData.description">
                            {{ categoryData.description }}
                        </p>
                    </div>
                </div>
                <div class="col-lg-4" *ngIf="categoryData.image">
                    <div class="category-image">
                        <img [src]="categoryData.image" [alt]="categoryData.title" class="img-fluid" />
                    </div>
                </div>
            </div>
        </div>
        <div class="hero-decoration"></div>
    </div>

    <app-products [categoryId]="this.categoryId"></app-products>
</div>
