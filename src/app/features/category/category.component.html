@if (loading) {
    <div class="sf-container py-5" role="status">Загружаем категорию…</div>
}
@if (error) {
    <p class="sf-container alert alert-danger" role="alert">{{ error }}</p>
}
@if (category | async; as categoryData) {
    @if (!error) {
        <header class="sf-container sf-page-header collection-header">
            <div>
                <nav class="collection-breadcrumb" aria-label="Навигационная цепочка">
                    <a href="/">Главная</a><span>/</span><a href="/products">Каталог</a><span>/</span><span>{{ categoryData.title }}</span>
                </nav>
                <p class="sf-eyebrow">Ваш ежедневный ритуал</p>
                <h1>{{ categoryData.title }}</h1>
                @if (categoryData.description) {
                    <app-overflow-description [text]="categoryData.description"></app-overflow-description>
                }
            </div>
            @if (categoryData.image) {
                <div class="collection-image"><img [src]="categoryData.image | imageUrl" [alt]="categoryData.title" /></div>
            }
        </header>
        <app-products [categoryId]="categoryId"></app-products>
    }
}
