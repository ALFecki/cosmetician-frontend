<div *ngIf="isLoading$ | async" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Загрузка...</span>
    </div>
</div>

<div *ngIf="(isLoading$ | async) === false">
    <app-navbar *ngIf="showNavbarAndFooter$ | async"></app-navbar>

    <main>
        <router-outlet></router-outlet>
    </main>

    <app-footer *ngIf="showNavbarAndFooter$ | async"></app-footer>
    <app-toast></app-toast>
</div>
