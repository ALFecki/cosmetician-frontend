<div [class.storefront]="showNavbarAndFooter$ | async">
    @if (showNavbarAndFooter$ | async) {
        <app-navbar></app-navbar>
    }
    <main>
        <router-outlet (activate)="onActivate()"></router-outlet>
    </main>
    @if (showNavbarAndFooter$ | async) {
        <app-footer></app-footer>
    }
    <app-toast [class.storefront-presentation]="showNavbarAndFooter$ | async"></app-toast>
    <app-loader [class.storefront-presentation]="showNavbarAndFooter$ | async"></app-loader>
</div>
