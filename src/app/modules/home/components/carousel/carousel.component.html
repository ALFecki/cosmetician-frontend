<div id="carouselExample" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">
        <div *ngFor="let slide of slides; let i = index" class="carousel-item fade" [class.active]="i === currentIndex">
            <img [src]="slide.image" class="d-block w-100" alt="{{ slide.title }}" />
            <div class="carousel-caption d-none d-md-block">
                <h5>{{ slide.title }}</h5>
            </div>
        </div>
    </div>

    <ol class="carousel-indicators">
        <li
            *ngFor="let slide of slides; let i = index"
            [class.active]="i === currentIndex"
            (click)="goToSlide(i)"
            (keydown.enter)="goToSlide(i)"
            (keydown.space)="goToSlide(i)"
            data-target="#carouselExample"
            [attr.data-slide-to]="i"
            tabindex="0"
            role="button"
        ></li>
        <a
            class="carousel-control-prev"
            (click)="prevSlide()"
            (keydown.enter)="prevSlide()"
            (keydown.space)="prevSlide()"
            role="button"
            data-slide="prev"
            tabindex="0"
        >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a
            class="carousel-control-next"
            (click)="nextSlide()"
            (keydown.enter)="nextSlide()"
            (keydown.space)="nextSlide()"
            role="button"
            data-slide="next"
            tabindex="0"
        >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </ol>
</div>
