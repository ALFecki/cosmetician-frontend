name: Frontend CI/CD

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            build_only:
                type: boolean
                default: true
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Verify build revision
              run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn
            - name: Install locked dependencies
              run: yarn install --frozen-lockfile --non-interactive
            - name: Production build
              run: yarn build --configuration production
            - name: Package build candidate
              run: tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C dist/proskin-frontend/browser .
            - uses: actions/upload-artifact@v4
              with:
                  name: frontend-build-${{ github.sha }}
                  path: ${{ runner.temp }}/frontend.tar.gz
                  retention-days: 30
                  if-no-files-found: error
                  compression-level: 0
                  overwrite: true

    test:
        name: Tests
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Verify test revision
              run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: yarn
            - name: Install locked dependencies
              run: yarn install --frozen-lockfile --non-interactive
            - name: Lint
              run: yarn lint
            - name: Formatting
              run: yarn fmt:check
            - name: Browser tests
              run: yarn test --watch=false --browsers=ChromeHeadless
            - name: Test storefront preview
              run: yarn test:storefront-preview
            - name: Test release transport
              run: python3 -B -m unittest discover -s tools -p test_deploy_production.py
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: frontend-build-${{ github.sha }}
                  path: ${{ runner.temp }}/frontend-release
            - name: Verify and package the static release
              run: |
                  python3 - <<'PY'
                  import hashlib, json, os, pathlib, re, tarfile

                  archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frontend-release/frontend.tar.gz'
                  with tarfile.open(archive, 'r:gz') as site:
                      with site.extractfile('./index.html') as index:
                          main = re.search(rb'<script\b[^>]*\bsrc="(main-[A-Za-z0-9]+\.js)"', index.read())
                      if main is None:
                          raise SystemExit('index.html does not reference a production browser bundle')
                      bundle = site.getmember('./' + main[1].decode('ascii'))
                      if not bundle.isfile() or bundle.size == 0:
                          raise SystemExit('The production browser bundle is empty or invalid')

                  with archive.open('rb') as stream:
                      checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
                  manifest = {
                      'schema': 1,
                      'component': 'frontend',
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'commit': os.environ['GITHUB_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'],
                      'build_source': 'github-actions',
                      'files': {'frontend.tar.gz': checksum},
                  }
                  archive.with_name('manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: frontend-${{ github.sha }}
                  path: ${{ runner.temp }}/frontend-release/
                  retention-days: 30
                  if-no-files-found: error
                  compression-level: 0
                  overwrite: true

    deploy:
        name: Deploy production
        needs: test
        if: >-
            github.repository == 'ALFecki/cosmetician-frontend' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            !contains(toJSON(inputs), '"build_only"')
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        concurrency:
            group: skviderm-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://skviderm.by/
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: frontend-${{ github.sha }}
                  path: release/frontend
            - name: Verify the tested commit is still on main
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
                  if [[ "$current" != "$GITHUB_SHA" ]]; then
                      echo '::error::Main changed during the build or approval. Start a new deployment.'
                      exit 1
                  fi
            - name: Deploy the verified frontend
              env:
                  SKVIDERM_DEPLOY_KEY: ${{ secrets.SKVIDERM_DEPLOY_KEY }}
                  SKVIDERM_DEPLOY_HOST: ${{ vars.SKVIDERM_DEPLOY_HOST }}
                  SKVIDERM_DEPLOY_HOST_KEY: ${{ vars.SKVIDERM_DEPLOY_HOST_KEY }}
              run: python3 -B tools/deploy_production.py release "$GITHUB_SHA" "$GITHUB_RUN_ID"
